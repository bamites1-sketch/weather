<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Real-time weather dashboard with 7-day forecast" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>WeatherNow</title>

    <!-- Preconnect to OpenWeather API and icon CDN for faster first fetch -->
    <link rel="preconnect" href="https://api.openweathermap.org" />
    <link rel="preconnect" href="https://openweathermap.org" />
    <link rel="dns-prefetch" href="https://api.openweathermap.org" />
    <link rel="dns-prefetch" href="https://openweathermap.org" />

    <!-- Inline critical CSS: prevent flash of unstyled background -->
    <style>
      html, body { margin: 0; padding: 0; background: #2563eb; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
